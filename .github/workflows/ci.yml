name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (dialog, OCR, display)
        run: sudo apt-get update && sudo apt-get install -y zenity tesseract-ocr xvfb
      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev,ocr]"
          python -m playwright install --with-deps chromium
          python scripts/make_samples.py
      - name: Type check
        run: mypy src
      - name: Unit and integration tests
        run: pytest -q tests/mcp tests/guard tests/platform
      - name: End-to-end (real browser + extension)
        run: |
          export CHROME="$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')"
          xvfb-run -a pytest -q tests/e2e

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build wheel && python scripts/build_release.py
      - name: Attach release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
