  <path d="M470 100 C495 100 495 120 518 120" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M250 212 C390 212 420 168 518 168" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
