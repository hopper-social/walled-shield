<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Practice sign-up · Walled</title>
<link rel="stylesheet" href="practice.css"></head>
<body><main class="practice">
<div class="tag">Walled practice page · nothing here is sent anywhere</div>
<h1>Create an account</h1>
<p>Click into <b>Password</b>. The Walled chip offers a strong password; use it, then press <b>Save to Walled vault</b>.</p>
<form action="#" autocomplete="on">
  <label>Email <input type="email" name="email" value="you@example.com" autocomplete="username"></label>
  <label>Password <input type="password" name="password" autocomplete="new-password"></label>
  <label>Confirm password <input type="password" name="confirm" autocomplete="new-password"></label>
  <button type="button">Create account</button>
</form></main></body></html>
