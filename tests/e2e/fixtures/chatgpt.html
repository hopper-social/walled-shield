<!doctype html>
<html><head><meta charset="utf-8"><title>ChatGPT (test double)</title>
<style>body{font-family:system-ui;background:#fff;color:#0d0d0d;max-width:760px;margin:30px auto}
.markdown{color:#0d0d0d} #prompt-textarea{border:1px solid #ccc;border-radius:16px;padding:12px;min-height:24px}
#drop{border:2px dashed #ccc;padding:12px;margin:8px 0;color:#888}</style></head>
<body>
<main>
  <div data-message-author-role="user"><div class="whitespace-pre-wrap">Explain photosynthesis</div></div>
  <div data-message-author-role="assistant"><div class="markdown prose"><p id="answer">Plants turn <strong>light</strong> into sugar.</p><pre><code id="code">print("hi")</code></pre></div></div>
</main>
<form id="composer">
  <div id="drop">Drop files here</div>
  <div id="prompt-textarea" class="ProseMirror" contenteditable="true"></div>
  <input type="file" id="upload" multiple hidden>
  <button type="button" id="attach">Attach</button>
  <button type="button" data-testid="send-button" id="send">Send</button>
</form>
<script>
  // Behaves like the real page: Enter or the send button sends, files are uploaded on change/drop/paste.
  window.__log = { sent: [], uploaded: [] };
  const box = document.getElementById("prompt-textarea");
  function send() { const t = box.innerText.trim(); if (!t) return; window.__log.sent.push(t); box.innerText = ""; }
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  document.getElementById("send").addEventListener("click", send);
  document.getElementById("attach").addEventListener("click", () => document.getElementById("upload").click());
  document.getElementById("upload").addEventListener("change", (e) => { for (const f of e.target.files) window.__log.uploaded.push(f.name); });
  const drop = document.getElementById("drop");
  drop.addEventListener("dragover", (e) => e.preventDefault());
  drop.addEventListener("drop", (e) => { e.preventDefault(); for (const f of e.dataTransfer.files) window.__log.uploaded.push("drop:" + f.name); });
  box.addEventListener("paste", (e) => { const fs = [...e.clipboardData.files]; if (fs.length) { e.preventDefault(); fs.forEach(f => window.__log.uploaded.push("paste:" + f.name)); } });
</script>
</body></html>
