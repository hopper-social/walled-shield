<!doctype html><html><head><meta charset="utf-8"><title>Example login</title>
<style>body{font-family:system-ui;max-width:420px;margin:60px auto} input{display:block;width:100%;margin:8px 0 16px;padding:8px}</style></head>
<body><h1>Sign in</h1>
<form id="f" onsubmit="event.preventDefault()">
  <label>Email <input id="email" type="email" name="email" autocomplete="username"></label>
  <label>Password <input id="pw" type="password" name="password" autocomplete="current-password"></label>
  <button>Sign in</button>
</form></body></html>
