<!doctype html>
<html><head><meta charset="utf-8"><title>Perplexity (test double)</title>
<style>body{font-family:system-ui;background:#fcfcf9;color:#13343b;max-width:760px;margin:30px auto} textarea{width:100%;height:60px}</style></head>
<body>
<h1 class="query">What is photosynthesis?</h1>
<div id="markdown-content-0" class="prose"><p id="answer">Photosynthesis converts <em>light</em> into chemical energy.</p></div>
<div>
  <textarea id="ask-input" placeholder="Ask anything…"></textarea>
  <input type="file" id="upload" multiple style="display:none">
  <button aria-label="Attach" id="attach">📎</button>
  <button aria-label="Submit" id="send">→</button>
</div>
<script>
  window.__log = { sent: [], uploaded: [] };
  const box = document.getElementById("ask-input");
  function send() { const t = box.value.trim(); if (!t) return; window.__log.sent.push(t); box.value = ""; }
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  document.getElementById("send").addEventListener("click", send);
  // Like many upload libraries: a detached input created on demand.
  document.getElementById("attach").addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file"; input.multiple = true; input.id = "detached-upload";
    input.addEventListener("change", () => { for (const f of input.files) window.__log.uploaded.push(f.name); });
    window.__detached = input;
    input.click();
  });
  document.getElementById("upload").addEventListener("change", (e) => { for (const f of e.target.files) window.__log.uploaded.push(f.name); });
</script>
</body></html>
