<!doctype html><html><head><meta charset="utf-8"><title>Create account</title>
<style>body{font-family:system-ui;max-width:420px;margin:60px auto} input{display:block;width:100%;margin:8px 0 16px;padding:8px}</style></head>
<body><h1>Create your account</h1>
<form id="f" onsubmit="event.preventDefault()">
  <label>Email <input id="email" type="email" name="email"></label>
  <label>Password <input id="pw1" type="password" autocomplete="new-password"></label>
  <label>Confirm password <input id="pw2" type="password" autocomplete="new-password"></label>
  <button>Sign up</button>
</form></body></html>
