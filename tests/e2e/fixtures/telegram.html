<!doctype html><html><head><meta charset="utf-8"><title>Telegram Web (test double)</title>
<style>body{font-family:system-ui;margin:0;display:flex;height:100vh} #column-left{width:260px;border-right:1px solid #ddd}
#chat{flex:1;display:flex;flex-direction:column} .bubbles{flex:1;overflow:auto;padding:10px}
.bubble{margin:6px;padding:8px;border-radius:8px;max-width:70%} .is-in{background:#eee} .is-out{background:#cfe9ba;margin-left:auto}
.input-message-input{border:1px solid #ccc;min-height:24px;padding:8px;margin:8px}</style></head>
<body>
<script>
  // Behaves like web.telegram.org/k: a login screen until "logged in", then a chat with BotFather.
  window.__sent = [];
  const logged = localStorage.getItem("tg-logged") === "1";
  if (!logged) {
    document.body.innerHTML = '<div id="auth-pages"><h1>Log in to Telegram by QR Code</h1><button id="fake-login">Simulate scanning the QR</button></div>';
    document.getElementById("fake-login").onclick = () => { localStorage.setItem("tg-logged", "1"); location.reload(); };
  } else {
    document.body.innerHTML = '<div id="column-left" class="chatlist"><div>Chats</div></div><div id="chat"><div class="top"><span class="peer-title">BotFather</span></div><div class="bubbles"></div><div class="input-message-input" contenteditable="true"></div><button class="btn-send">Send</button></div>';
    const bubbles = document.querySelector(".bubbles");
    const add = (cls, text) => { const b = document.createElement("div"); b.className = "bubble " + cls; const m = document.createElement("div"); m.className = "message"; m.textContent = text; b.append(m); bubbles.append(b); };
    const replies = {
      newbot: "Alright, a new bot. How are we going to call it? Please choose a name for your bot.",
      name: "Good. Now let's choose a username for your bot. It must end in `bot`.",
      username: "Done! Congratulations on your new bot. Use this token to access the HTTP API:\n123456789:AAH" + "x".repeat(32) + "\nKeep your token secure.",
    };
    let step = 0;
    document.querySelector(".btn-send").onclick = () => {
      const box = document.querySelector(".input-message-input");
      const text = box.textContent.trim();
      if (!text) return;
      window.__sent.push(text); add("is-out", text); box.textContent = "";
      setTimeout(() => {
        if (text === "/newbot") { add("is-in", replies.newbot); step = 1; }
        else if (text === "/help") add("is-in", "I can help you create and manage Telegram bots.");
        else if (step === 1) { add("is-in", replies.name); step = 2; }
        else if (step === 2) { add("is-in", replies.username); step = 3; }
      }, 150);
    };
  }
</script>
</body></html>
